name: Recompile Installers (Manual Dispatch Only)

# ==============================================================================
# ⚠️ WORKFLOW DISABLED TEMPORARILY FOR SMARTSCREEN & FILE REPUTATION ACCUMULATION
# ⚠️ تم إيقاف بناء ملفات التثبيت مؤقتاً بالكامل للحفاظ على ثبات الـ SHA256 وتجميع سمعة Windows SmartScreen
# ==============================================================================
# All ZenCord installers (ZenCordInstaller.exe, ZenCordInstaller.dmg, ZenCordInstaller-linux.AppImage, etc.)
# are permanently locked and frozen in the 'latest' release. DO NOT recompile or build new installers
# because every recompilation generates a new binary hash which immediately resets the Windows SmartScreen
# and antivirus reputation counter.
# ==============================================================================

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "⚠️ Installer builds are temporarily DISABLED to accumulate permanent Windows SmartScreen and Gatekeeper reputation."
          echo "⚠️ All installers remain static with fixed SHA256 hashes."

