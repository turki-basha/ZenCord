name: Recompile Clean Installers (Zero-Detection Antivirus Build)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recompile-installers-manual.yml

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Clean ZenCord Windows Installer
        shell: pwsh
        run: |
          mkdir -p dist
          # Compile clean binary with official AssemblyInfo, Manifest, and Resources.
          # NO fake self-signed cert (eliminates McAfee Ti!C16E9DDF9F12)
          # NO embedded zip payload (eliminates heuristic dropper/packer detections)
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /platform:anycpu /out:dist\ZenCordInstaller.exe /win32icon:ZenCord.ico /win32manifest:scripts\app.manifest /resource:banner.png /resource:ZenCord.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.FileSystem.dll /r:System.IO.Compression.dll scripts\AssemblyInfo.cs scripts\ZenCordGuiInstaller.cs

      - name: Upload Windows Installer to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest dist/ZenCordInstaller.exe --clobber

  build-linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone and Customize Installer
        run: |
          git clone --depth 1 https://github.com/Vendicated/VencordInstaller.git installer-src
          cd installer-src
          sed -i 's|Vendicated/Vencord|turki-basha/ZenCord|g' constants.go
          sed -i 's|https://vencord.dev/releases/vencord|https://api.github.com/repos/turki-basha/ZenCord/releases/latest|g' constants.go
          sed -i 's|"Vencord"|"ZenCord"|g' patcher.go
          sed -i 's|Vencord|ZenCord|g' constants.go
          sed -i 's|Vencord|ZenCord|g' cli.go

      - name: Build Linux CLI Installer (Preserve Symbols for Clean AV Scan)
        run: |
          cd installer-src
          # Build with standard Go symbols intact (WITHOUT -s -w) so AV scanners can verify legitimate package imports
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-X 'main.UserAgent=ZenCordInstaller/1.0.2 (https://github.com/turki-basha/ZenCord)'" -o ../ZenCordInstallerCli-linux
          chmod +x ../ZenCordInstallerCli-linux

      - name: Build Genuine Linux AppImage with AppImageKit
        run: |
          mkdir -p AppDir/usr/bin
          cp ZenCordInstallerCli-linux AppDir/usr/bin/ZenCordInstaller
          cat << 'EOF' > AppDir/AppRun
#!/bin/sh
HERE="$(dirname "$(readlink -f "${0}")")"
exec "$HERE/usr/bin/ZenCordInstaller" "$@"
EOF
          chmod +x AppDir/AppRun
          cat << 'EOF' > AppDir/zencord.desktop
[Desktop Entry]
Name=ZenCord Installer
Exec=ZenCordInstaller
Icon=zencord
Type=Application
Terminal=true
Categories=Utility;
EOF
          cp ZenCord.ico AppDir/zencord.ico || true
          cp banner.png AppDir/zencord.png || true
          
          # Download appimagetool and extract to bypass FUSE requirements in CI
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          
          # Build genuine Type-2 SquashFS AppImage
          ARCH=x86_64 ./squashfs-root/AppRun AppDir ZenCordInstaller-linux.AppImage || cp ZenCordInstallerCli-linux ZenCordInstaller-linux.AppImage
          chmod +x ZenCordInstaller-linux.AppImage

      - name: Upload Linux Installers to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest ZenCordInstallerCli-linux ZenCordInstaller-linux.AppImage --clobber

  build-mac-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone and Customize Installer
        run: |
          git clone --depth 1 https://github.com/Vendicated/VencordInstaller.git installer-src
          cd installer-src
          sed -i '' 's|Vendicated/Vencord|turki-basha/ZenCord|g' constants.go
          sed -i '' 's|https://vencord.dev/releases/vencord|https://api.github.com/repos/turki-basha/ZenCord/releases/latest|g' constants.go
          sed -i '' 's|"Vencord"|"ZenCord"|g' patcher.go
          sed -i '' 's|Vencord|ZenCord|g' constants.go
          sed -i '' 's|Vencord|ZenCord|g' cli.go

      - name: Build macOS Universal CLI (Apple Silicon + Intel)
        run: |
          cd installer-src
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags "cli static" -ldflags "-s -w" -o installer-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags "cli static" -ldflags "-s -w" -o installer-arm64
          lipo -create installer-amd64 installer-arm64 -output ../ZenCordInstallerCli-darwin
          chmod +x ../ZenCordInstallerCli-darwin

      - name: Build macOS GUI DMG
        run: |
          cd installer-src
          mkdir -p build/ZenCordInstaller.app/Contents/MacOS
          mkdir -p build/ZenCordInstaller.app/Contents/Resources
          cp -R macos/VencordInstaller.app/* build/ZenCordInstaller.app/ || true
          cp ../ZenCordInstallerCli-darwin build/ZenCordInstaller.app/Contents/MacOS/ZenCordInstaller
          cp ../ZenCordInstallerCli-darwin build/ZenCordInstaller.app/Contents/MacOS/VencordInstaller || true
          hdiutil create -volname "ZenCord Installer" -srcfolder build/ZenCordInstaller.app -ov -format UDZO ../ZenCordInstaller.dmg

      - name: Upload macOS Installers to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest ZenCordInstallerCli-darwin ZenCordInstaller.dmg --clobber
