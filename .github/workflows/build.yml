name: Build ZenCord

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/**
            - package.json
            - pnpm-lock.yaml

permissions:
    contents: write

env:
    FORCE_COLOR: true

jobs:
    Build:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.9.0

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build desktop
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up unnecessary files
              shell: bash
              run: |
                  rm -rf dist/*-unpacked dist/vendor Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

            - name: Build Windows GUI Installer (ZenCordInstaller.exe)
              shell: pwsh
              run: |
                  Compress-Archive -Path dist\* -DestinationPath ZenCordPayload.zip -Force
                  C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /optimize+ /platform:x64 /filealign:512 /debug- /out:dist\ZenCordInstaller.exe /win32icon:ZenCord.ico /win32manifest:scripts\app.manifest /resource:banner.png /resource:ZenCord.ico /resource:ZenCordPayload.zip /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.FileSystem.dll /r:System.IO.Compression.dll scripts\AssemblyInfo.cs scripts\ZenCordGuiInstaller.cs
                  Remove-Item ZenCordPayload.zip -Force
                  $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=ZenCord Open Source Project, O=ZenCord Team" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5) -HashAlgorithm SHA256
                  Set-AuthenticodeSignature -FilePath "dist\ZenCordInstaller.exe" -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"

            - name: Publish latest release with installer
              if: github.repository == 'turki-basha/ZenCord'
              shell: bash
              run: |
                  RELEASE_TAG="$(git rev-parse --short HEAD)"
                  echo "Publishing latest release for commit: ${RELEASE_TAG}"
                  gh release delete latest --yes || true
                  gh release create latest dist/* --title "ZenCord ${RELEASE_TAG}" --notes "Latest automated build of ZenCord (${RELEASE_TAG}) including ZenCordInstaller.exe for Windows."
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
