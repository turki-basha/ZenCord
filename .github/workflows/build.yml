name: Build ZenCord

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - src/**
      - browser/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: write

env:
  FORCE_COLOR: true

jobs:
  Build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm buildWebStandalone

      - name: Build desktop
        run: pnpm build --standalone

      - name: Generate plugin list
        run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

      - name: Clean up unnecessary files
        shell: bash
        run: |
          rm -rf dist/*-unpacked dist/vendor ZenCord.user.css zencordDesktopRenderer.css zencordDesktopRenderer.css.map Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

      - name: Preserve Fixed Cross-Platform Installers (Windows, macOS, Linux)
        shell: bash
        run: |
          # Keep all installers permanently static so their SHA256 hashes NEVER change.
          # This allows Windows SmartScreen, macOS Gatekeeper, and Linux package checksums to accumulate permanent reputation.
          gh release download latest -p "ZenCordInstaller*" -D dist/ || echo "Previous installers downloaded or already present"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest release with all fixed installers
        if: github.repository == 'turki-basha/ZenCord'
        shell: bash
        run: |
          RELEASE_TAG="$(git rev-parse --short HEAD)"
          echo "Publishing latest release for commit: ${RELEASE_TAG}"
          gh release delete latest --yes || true
          gh release create latest dist/* --title "ZenCord ${RELEASE_TAG}" --notes "Official automated build of ZenCord (${RELEASE_TAG}) with static Windows, macOS, and Linux installers."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
