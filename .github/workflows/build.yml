name: Build ZenCord

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - src/**
      - browser/**
      - scripts/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: write

env:
  FORCE_COLOR: true

jobs:
  Build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm buildWebStandalone

      - name: Build desktop
        run: pnpm build --standalone

      - name: Generate plugin list
        run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

      - name: Clean up unnecessary files
        shell: bash
        run: |
          rm -rf dist/*-unpacked dist/vendor ZenCord.user.css zencordDesktopRenderer.css zencordDesktopRenderer.css.map Vencord.user.css vencordDesktopRenderer.css vencordDesktopRenderer.css.map

      # ==============================================================================
      # ⚠️ FROZEN INSTALLERS - DO NOT RECOMPILE OR MODIFY (SMARTSCREEN REPUTATION LOCK)
      # ⚠️ تم تجميد ملفات التثبيت نهائياً لتجميع سمعة Windows SmartScreen وعدم مساسها
      # ==============================================================================
      - name: Remove any installer binaries from dist
        shell: bash
        run: |
          # Never include or overwrite installer binaries in automated update releases
          rm -f dist/ZenCordInstaller* dist/*.exe dist/*.dmg dist/*.AppImage

      - name: Publish updater assets to latest release
        if: github.repository == 'turki-basha/ZenCord'
        shell: bash
        run: |
          RELEASE_TAG="$(git rev-parse --short HEAD)"
          echo "Uploading updater assets for commit: ${RELEASE_TAG}"
          # Ensure 'latest' release exists without deleting it
          gh release view latest || gh release create latest --title "ZenCord ${RELEASE_TAG}" --notes "ZenCord official automated releases"
          # Update release title and notes to current commit hash so client updaters and users detect the new version
          gh release edit latest --title "ZenCord ${RELEASE_TAG}" --notes "ZenCord official automated release for commit ${RELEASE_TAG} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Upload or update ONLY the updater assets (leaving installer binaries permanently untouched)
          gh release upload latest dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
